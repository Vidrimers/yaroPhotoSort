<!DOCTYPE html>
<html lang="en" data-theme="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yaroPhotoSort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, [data-theme="lab"] {
  --bg: #22201d;
  --bg-2: #2a2824;
  --bg-3: #1a1816;
  --line: #3c3832;
  --line-2: #4a453c;
  --text: #e7e2d8;
  --muted: #a29b8c;
  --faint: #776f62;
  --amber: #d9a441;
  --amber-ink: #241a05;
  --ok: #8aa87c;
  --bad: #c45c4c;
  --btn-bg: #322e28;
  --btn-hover: #3c3832;
  --input-bg: #1a1816;
  --focus: var(--amber);
  --accent-only-run: var(--amber);
  color-scheme: dark;
}

[data-theme="paper"] {
  --bg: #e9e2d4;
  --bg-2: #e2d9c8;
  --bg-3: #f2ece1;
  --line: #c4b8a2;
  --line-2: #a89a80;
  --text: #1c1914;
  --muted: #6b6254;
  --faint: #8d8271;
  --amber: #b03a2e;
  --amber-ink: #f7f1e7;
  --ok: #2f6b4f;
  --bad: #b03a2e;
  --btn-bg: #ddd2bc;
  --btn-hover: #d2c5ab;
  --input-bg: #f4eee3;
  --focus: var(--bad);
  --accent-only-run: var(--bad);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.5 "Source Sans 3", "Segoe UI", sans-serif;
  min-height: 100vh;
}

.wrap {
  width: min(1200px, calc(100% - 36px));
  margin: 0 auto;
  padding: 22px 0 56px;
}

.top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}
.brand {
  font-family: "Bitter", Georgia, serif;
  font-weight: 700;
  font-size: clamp(22px, 3vw, 30px);
  letter-spacing: -0.015em;
  margin-right: auto;
}
.brand small {
  display: block;
  font-family: "Source Sans 3", sans-serif;
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0;
  margin-top: 2px;
}

.btn {
  appearance: none;
  border: 1px solid var(--line-2);
  background: var(--btn-bg);
  color: var(--text);
  font: 600 13.5px/1 "Source Sans 3", sans-serif;
  padding: 11px 15px;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--btn-hover); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn-primary {
  background: var(--accent-only-run);
  border-color: var(--accent-only-run);
  color: var(--amber-ink);
}
.btn-primary:hover { filter: brightness(1.07); }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn-ghost { background: transparent; }
.btn[disabled] { opacity: 0.42; cursor: not-allowed; transform: none; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* кастомный селект */
.select { position: relative; }
.select-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line-2);
  background: var(--btn-bg);
  color: var(--text);
  font: 600 13.5px/1 "Source Sans 3", sans-serif;
  padding: 11px 13px;
  border-radius: 3px;
  cursor: pointer;
  min-width: 128px;
  justify-content: space-between;
}
.select-btn:hover { background: var(--btn-hover); }
.select-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.select-chevron { opacity: 0.65; flex: none; }
.select-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  min-width: 100%;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 3px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.28);
  z-index: 30;
}
.select-menu li {
  padding: 9px 11px;
  cursor: pointer;
  border-radius: 2px;
  white-space: nowrap;
  font-size: 13.5px;
}
.select-menu li:hover,
.select-menu li[aria-selected="true"] {
  background: var(--btn-hover);
}
.select-menu li[aria-selected="true"] {
  color: var(--accent-only-run);
  font-weight: 600;
}

.grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 0 28px;
  border: 1px solid var(--line);
  background: var(--bg-2);
}
.col { min-width: 0; }
.col > section {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
}
.col > section:last-child { border-bottom: 0; }
.col + .col { border-left: 1px solid var(--line); }

@media (max-width: 940px) {
  .grid { grid-template-columns: 1fr; }
  .col + .col { border-left: 0; border-top: 1px solid var(--line); }
}

section h2 {
  font-family: "Bitter", Georgia, serif;
  font-weight: 500;
  font-size: 17px;
  margin: 0 0 3px;
  letter-spacing: -0.01em;
}
.hint {
  margin: 0 0 14px;
  color: var(--muted);
  font-size: 13.5px;
  max-width: 52ch;
}
.hint code, .footer-note code {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 12px;
  color: var(--faint);
}

.folder-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}
.folder-input {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text);
  font: 400 13px/1.4 "JetBrains Mono", Consolas, monospace;
  padding: 11px 12px;
  border-radius: 3px;
}
.folder-input:focus { outline: none; border-color: var(--focus); }
.dropzone {
  margin-top: 10px;
  border: 1px dashed var(--line-2);
  padding: 12px;
  text-align: center;
  color: var(--faint);
  font-size: 13px;
  background: var(--bg-3);
}
.dropzone.drag {
  border-color: var(--accent-only-run);
  color: var(--accent-only-run);
  background: var(--bg);
}

.lm-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--faint);
  flex: none;
}
.dot.on { background: var(--ok); }
.dot.off { background: var(--bad); }
.lm-title { font-weight: 600; }
.lm-sub {
  color: var(--faint);
  font-size: 12px;
  font-family: "JetBrains Mono", Consolas, monospace;
}
.kv {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 6px 12px;
  font-size: 13.5px;
  margin: 0;
}
.kv dt { color: var(--faint); }
.kv dd {
  margin: 0;
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 12.5px;
  word-break: break-all;
}

fieldset {
  border: 0;
  margin: 0 0 12px;
  padding: 0;
}
fieldset:last-child { margin-bottom: 0; }
legend {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  padding: 0;
}
.check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 0;
  cursor: pointer;
}
.check input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent-only-run);
  margin-top: 2px;
  flex: none;
}
.check .sub {
  display: block;
  color: var(--faint);
  font-size: 12.5px;
  margin-top: 1px;
}

.radio-row { display: flex; flex-direction: column; gap: 2px; }
.radio-row label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  cursor: pointer;
  font-size: 14px;
}
.radio-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent-only-run);
}
.radio-row.sub-options {
  margin: 2px 0 0 26px;
  padding-left: 12px;
  border-left: 1px solid var(--line);
}
.radio-row.sub-options label {
  padding: 6px 0;
  font-size: 13.5px;
  color: var(--muted);
}
.radio-row.sub-options.disabled {
  opacity: 0.45;
}
.radio-row.sub-options label:has(input:disabled) {
  cursor: not-allowed;
}

.formats { display: flex; flex-wrap: wrap; gap: 6px; }
.fmt {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  cursor: pointer;
  font: 500 12px/1 "JetBrains Mono", Consolas, monospace;
  background: var(--bg-3);
  color: var(--muted);
}
.fmt:has(input:checked) {
  border-color: var(--text);
  color: var(--text);
  background: var(--bg);
}
.fmt input { width: 14px; height: 14px; accent-color: var(--accent-only-run); }

.num-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}
.num-row label { color: var(--muted); font-size: 13.5px; }
.num-row input[type="number"] {
  width: 90px;
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text);
  font: 500 14px/1 "JetBrains Mono", Consolas, monospace;
  padding: 8px;
  border-radius: 3px;
}

.cat-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.cat-table th {
  text-align: left;
  font-weight: 600;
  color: var(--faint);
  font-size: 12px;
  padding: 0 6px 8px;
  border-bottom: 1px solid var(--line);
}
.cat-table td {
  padding: 6px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.cat-table tr:last-child td { border-bottom: 0; }
.cat-table input[type="text"], .cat-table select {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text);
  font: 400 12px/1.3 "JetBrains Mono", Consolas, monospace;
  padding: 7px 8px;
  border-radius: 3px;
}
.cat-table input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--accent-only-run);
}
.cat-table .cat-off td { opacity: 0.45; }
.cat-table .cat-off td:first-child { opacity: 1; }
.cat-table input:disabled, .cat-table select:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.cat-table.cats-locked tbody {
  opacity: 0.45;
  pointer-events: none;
}
.cat-toggle {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 12px;
  font-weight: 600;
  cursor: pointer;
}
.cat-toggle input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent-only-run);
}

.run-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--line);
  margin-bottom: 14px;
}
.stat {
  padding: 12px 14px;
  background: var(--bg-3);
}
.stat + .stat { border-left: 1px solid var(--line); }
.stat b {
  display: block;
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.stat span { color: var(--faint); font-size: 12px; }
.stat.ok b { color: var(--ok); }
.stat.bad b { color: var(--bad); }
.stat.run b { color: var(--accent-only-run); }
@media (max-width: 640px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}

.strip {
  position: relative;
  height: 38px;
  border: 1px solid var(--line-2);
  background: var(--bg-3);
  overflow: hidden;
  margin-bottom: 8px;
  background-image:
    radial-gradient(circle at 8px 5px, var(--bg-2) 3px, transparent 3.5px),
    radial-gradient(circle at 8px calc(100% - 5px), var(--bg-2) 3px, transparent 3.5px);
  background-size: 16px 100%;
  background-repeat: repeat-x;
}
.strip .fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: var(--accent-only-run);
  opacity: 0.22;
  border-right: 2px solid var(--accent-only-run);
  transition: width 0.35s ease;
}
.strip .bad-tick {
  position: absolute;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--bad);
}
.strip-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--faint);
  font: 400 12px/1.4 "JetBrains Mono", Consolas, monospace;
  margin-bottom: 14px;
}

.log {
  background: var(--bg-3);
  border: 1px solid var(--line);
  padding: 11px 12px;
  font: 400 12px/1.55 "JetBrains Mono", Consolas, monospace;
  color: var(--muted);
  max-height: 250px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.log .bad { color: var(--bad); }
.log .ok { color: var(--ok); }
.log .err { color: var(--bad); }

.footer-note {
  margin-top: 12px;
  color: var(--faint);
  font-size: 12.5px;
}

.alert {
  display: none;
  margin: 0 0 18px;
  padding: 13px 15px;
  border: 1px solid var(--bad);
  background: var(--bg-3);
  color: var(--bad);
  font-size: 14px;
}
.alert.show { display: block; }
.alert strong { display: block; margin-bottom: 3px; }
.alert code {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 12px;
}

/* модальный confirm */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-overlay[hidden] { display: none; }
.modal {
  width: min(420px, 100%);
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 3px;
  padding: 20px 22px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.35);
}
.modal-title {
  font-family: "Bitter", Georgia, serif;
  font-size: 18px;
  font-weight: 500;
  margin: 0 0 8px;
}
.modal-text {
  color: var(--muted);
  font-size: 14px;
  margin: 0 0 18px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* модалка «Как пользоваться» */
.modal-help {
  width: min(640px, 100%);
  max-height: min(84vh, 860px);
  display: flex;
  flex-direction: column;
  padding: 0;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 3px;
}
.modal-help-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line);
}
.modal-help-head h2 {
  margin: 0;
  font-family: "Bitter", Georgia, serif;
  font-size: 20px;
  font-weight: 500;
  flex: 1;
}
.modal-help-body {
  overflow: auto;
  padding: 8px 22px 18px;
}
.help-step {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line-soft);
}
.help-step:last-child { border-bottom: 0; }
.help-num {
  width: 26px;
  height: 26px;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 600 12px/1 "JetBrains Mono", monospace;
  color: var(--muted);
  margin-top: 1px;
}
.help-step h3 {
  margin: 0 0 4px;
  font-size: 14.5px;
  font-weight: 600;
}
.help-step p {
  margin: 0;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.55;
  max-width: 58ch;
}
.help-step code {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 12px;
  color: var(--faint);
}
.help-note {
  margin: 12px 0 0;
  padding: 12px 14px;
  border-left: 2px solid var(--accent-only-run);
  color: var(--muted);
  font-size: 13px;
  background: var(--bg-3);
}

/* экран проверки */
.modal-review {
  width: min(760px, 100%);
  max-height: min(90vh, 920px);
  display: flex;
  flex-direction: column;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 3px;
}
.review-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}
.review-head h2 {
  margin: 0;
  font-family: "Bitter", Georgia, serif;
  font-size: 19px;
  font-weight: 500;
  flex: 1;
}
.review-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  color: var(--muted);
}
.review-body {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 0;
  overflow: hidden;
  min-height: 280px;
}
@media (max-width: 700px) {
  .review-body { grid-template-columns: 1fr; }
}
.review-photo {
  background: var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 280px;
  max-height: 52vh;
  overflow: hidden;
}
.review-photo img {
  max-width: 100%;
  max-height: 52vh;
  object-fit: contain;
  display: block;
}
.review-meta {
  padding: 16px 18px;
  border-left: 1px solid var(--line);
  overflow: auto;
}
.review-meta dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 12px;
  margin: 0;
  font-size: 13px;
}
.review-meta dt { color: var(--faint); }
.review-meta dd {
  margin: 0;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  word-break: break-all;
}
.review-actions {
  display: flex;
  gap: 8px;
  padding: 14px 20px 18px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.review-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--muted);
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      yaroPhotoSort
      <small data-i18n="app.subtitle"></small>
    </div>

    <div class="top-actions">
      <div class="select" id="themeSelect" data-i18n-title="theme.switch">
        <button class="select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="select-value"></span>
          <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <ul class="select-menu" role="listbox" hidden>
          <li role="option" data-value="lab" data-i18n="theme.lab"></li>
          <li role="option" data-value="paper" data-i18n="theme.paper"></li>
        </ul>
      </div>

      <div class="select" id="langSelect" data-i18n-title="lang.switch">
        <button class="select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="select-value"></span>
          <svg class="select-chevron" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <ul class="select-menu" role="listbox" hidden>
          <li role="option" data-value="en" data-i18n="lang.en"></li>
          <li role="option" data-value="ru" data-i18n="lang.ru"></li>
        </ul>
      </div>

      <button class="btn" id="btnHelp" type="button" data-i18n="btn.help"></button>

      <a class="btn btn-primary" id="btnStartServer" href="yarophoto://start" data-i18n="btn.startServer"></a>
      <button class="btn btn-danger" id="btnStopServer" type="button" data-i18n="btn.stopServer" hidden></button>
      <button class="btn" id="btnOpenPanel" type="button" data-i18n="btn.openPanel"></button>
    </div>
  </header>

  <div class="alert" id="serverAlert">
    <strong id="alertTitle"></strong>
    <span id="alertText"></span>
  </div>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-actions">
        <button class="btn" type="button" id="modalCancel"></button>

<script>
const $ = (id) => document.getElementById(id);
const api = {
  async get(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    return r.json();
  },
  async post(path, body) {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    return r.json();
  },
};

/* ── i18n ── */
let I18N = {};
let LANG = localStorage.getItem("yarophoto-lang") || "en";

function t(key, vars) {
  let s = I18N[key] != null ? I18N[key] : key;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) {
      s = s.replaceAll("{" + k + "}", String(v));
    }
  }
  return s;
}

function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => {
    el.title = t(el.dataset.i18nTitle);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  // локализуем сгенерированный контент
  renderFormats(collectFormats());
  renderCategories(collectCategories().length ? collectCategories() : DEFAULT_CATEGORIES);
  updateDestPreview();
  renderLm(lastLm || {});
  renderJob(lastJob || {}, lastLog || []);
  $("portHint").textContent = t("behavior.portHint");
  syncSelectLabels();
}

function syncSelectLabels() {
  const theme = document.documentElement.dataset.theme === "paper" ? "paper" : "lab";
  $("themeSelect").querySelector(".select-value").textContent =
    t("theme.label") + ": " + t("theme." + theme);
  $("themeSelect").querySelectorAll("[role=option]").forEach((li) => {
    li.setAttribute("aria-selected", li.dataset.value === theme ? "true" : "false");
  });
  $("langSelect").querySelector(".select-value").textContent = t(LANG === "ru" ? "lang.ru" : "lang.en");
  $("langSelect").querySelectorAll("[role=option]").forEach((li) => {
    li.setAttribute("aria-selected", li.dataset.value === LANG ? "true" : "false");
  });
  renderHelp();
}

function renderHelp() {
  const body = $("helpBody");
  if (!body) return;
  const steps = [];
  for (let i = 1; i <= 7; i++) {
    const title = t(`help.s${i}.t`);
    const text = t(`help.s${i}.p`);
    if (title !== `help.s${i}.t`) steps.push({ i, title, text });
  }
  body.innerHTML = steps.map((s) => `
    <div class="help-step">
      <div class="help-num">${s.i}</div>
      <div>
        <h3>${escapeHtml(s.title)}</h3>
        <p>${s.text}</p>
      </div>
    </div>`).join("") + `<div class="help-note">${t("help.note")}</div>`;
}

function loadLang(lang) {
  return new Promise((resolve) => {
    const done = (dict) => {
      I18N = dict || {};
      LANG = lang;
      localStorage.setItem("yarophoto-lang", lang);
      applyI18n();
      resolve();
    };
    // <script src> работает и с file://, и через сервер — в отличие от fetch
    const prev = document.getElementById("i18n-script");
    if (prev) prev.remove();
    const s = document.createElement("script");
    s.id = "i18n-script";
    s.src = `locales/${lang}.js`;
    s.onload = () => done(window.YARO_I18N);
    s.onerror = () => {
      console.warn("i18n load failed:", lang);
      if (lang !== "en") loadLang("en").then(resolve);
      else done(I18N);
    };
    document.head.appendChild(s);
  });
}

/* ── theme + language selects ── */
function setTheme(name) {
  document.documentElement.dataset.theme = name;
  localStorage.setItem("yarophoto-theme", name);
  syncSelectLabels();
}

function closeAllSelects(except) {
  document.querySelectorAll(".select").forEach((root) => {
    if (root === except) return;
    root.querySelector(".select-menu").hidden = true;
    root.querySelector(".select-btn").setAttribute("aria-expanded", "false");
  });
}

function bindSelect(root, onPick) {
  const btn = root.querySelector(".select-btn");
  const menu = root.querySelector(".select-menu");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = menu.hidden;
    closeAllSelects(root);
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  menu.querySelectorAll("[role=option]").forEach((li) => {
    li.addEventListener("click", (e) => {
      e.stopPropagation();
      menu.hidden = true;
      btn.setAttribute("aria-expanded", "false");
      onPick(li.dataset.value);
    });
  });
}

bindSelect($("themeSelect"), setTheme);
bindSelect($("langSelect"), (lang) => { if (lang !== LANG) loadLang(lang); });
document.addEventListener("click", () => closeAllSelects(null));

const FORMAT_LIST = [
  { ext: ".jpg", label: ".jpg/.jpeg", match: [".jpg", ".jpeg"] },
  { ext: ".png", label: ".png", match: [".png"] },
  { ext: ".webp", label: ".webp", match: [".webp"] },
  { ext: ".heic", label: ".heic/.heif", match: [".heic", ".heif"] },
  { ext: ".bmp", label: ".bmp", match: [".bmp"] },
  { ext: ".gif", label: ".gif", match: [".gif"] },
  { ext: ".tif", label: ".tif/.tiff", match: [".tif", ".tiff"] },
];

const DEFAULT_FORMATS = [".jpg", ".jpeg", ".png", ".webp"];

const DEFAULT_CATEGORIES = [
  "people", "docs", "screenshot", "food", "nature",
  "animals", "transport", "interior", "other",
].map((key) => ({ key, name: key, enabled: true, dest: "", action: "copy" }));

let config = null;
let saveTimer = null;
let polling = false;
let lastLm = null;
let lastJob = null;
let lastLog = null;

function serverOffline(show) {
  $("serverAlert").classList.toggle("show", !!show);
  $("btnStartServer").hidden = !show;
  $("btnStopServer").hidden = !!show;
  $("btnOpenPanel").style.display = (!show && location.protocol === "file:") ? "" : "none";
  if (show) {
    const fileMode = location.protocol === "file:";
    $("alertTitle").textContent = t(fileMode ? "alert.fileMode.title" : "alert.serverDown.title");
    $("alertText").textContent = t(fileMode ? "alert.fileMode.text" : "alert.serverDown.text");
  }
}

function collectFormats() {
  const out = [];
  document.querySelectorAll("#formats input:checked").forEach((input) => {
    const item = FORMAT_LIST.find((f) => f.ext === input.dataset.ext);
    if (item) out.push(...item.match);
  });
  return out.length ? out : DEFAULT_FORMATS.slice();
}

function collectCategories() {
  return Array.from(document.querySelectorAll("#cats tr")).map((row) => ({
    key: row.dataset.key,
    name: row.dataset.name,
    enabled: row.querySelector(".cat-on").checked,
    dest: row.querySelector(".cat-dest").value.trim(),
    action: row.querySelector(".cat-action").value,
  }));
}

function currentConfigPatch() {
  return {
    input_folder: $("inputFolder").value.trim(),
    output_mode: document.querySelector('input[name="outputMode"]:checked')?.value || "csv_only",
    review_mode: document.querySelector('input[name="reviewMode"]:checked')?.value || "auto",
    review_timing: document.querySelector('input[name="reviewTiming"]:checked')?.value || "batch",
    bad_folder_name: "_rejects",
    score_threshold: Math.max(1, Math.min(5, parseInt($("scoreThreshold").value || "2", 10))),
    port: Math.max(1024, Math.min(65535, parseInt($("serverPort").value || "8460", 10))),
    quality_rules: {
      blur: $("ruleBlur").checked,
      exposure: $("ruleExposure").checked,
      junk: $("ruleJunk").checked,
    },
    formats: collectFormats(),
    recursive: $("optRecursive").checked,
    resume: $("optResume").checked,
    dry_run: $("optDry").checked,
    categorization: $("optCategories").checked,
    categories: collectCategories(),
    add_reason_to_name: $("optReasonName").checked,
    preserve_structure: $("optPreserve").checked,
    max_image_side: 1280,
  };
}

async function saveConfigNow() {
  try {
    await api.post("/api/config", currentConfigPatch());
  } catch (e) {
    console.warn("save config", e);
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveConfigNow, 350);
}

function renderFormats(selected) {
  const box = $("formats");
  if (!box) return;
  const prev = selected || collectFormats();
  box.innerHTML = "";
  const sel = new Set(prev.map((s) => s.toLowerCase()));
  FORMAT_LIST.forEach((f) => {
    const on = f.match.some((m) => sel.has(m));
    const label = document.createElement("label");
    label.className = "fmt";
    label.title = t("formats.tip", { label: f.label });
    label.innerHTML = `<input type="checkbox" data-ext="${f.ext}" ${on ? "checked" : ""}><span>${f.label}</span>`;
    label.querySelector("input").addEventListener("change", scheduleSave);
    box.appendChild(label);
  });
}

function syncCatRow(row) {
  const on = row.querySelector(".cat-on").checked;
  const master = $("optCategories").checked;
  const enabled = on && master;
  row.querySelector(".cat-dest").disabled = !enabled;
  row.querySelector(".cat-action").disabled = !enabled;
  row.classList.toggle("cat-off", !on);
}

function syncAllCatRows() {
  document.querySelectorAll("#cats tr").forEach(syncCatRow);
  $("cats").closest("table").classList.toggle("cats-locked", !$("optCategories").checked);
}

function syncReviewTiming() {
  const ask = document.querySelector('input[name="reviewMode"]:checked')?.value === "ask";
  const box = $("reviewTiming");
  box.classList.toggle("disabled", !ask);
  box.querySelectorAll("input").forEach((el) => { el.disabled = !ask; });
}

function renderCategories(cats) {
  const body = $("cats");
  if (!body) return;
  body.innerHTML = "";
  (cats || []).forEach((c) => {
    const row = document.createElement("tr");
    row.dataset.key = c.key;
    row.dataset.name = c.name;
    row.innerHTML = `
      <td><input type="checkbox" class="cat-on" ${c.enabled ? "checked" : ""} aria-label="${escapeAttr(t("cat." + c.key))}"></td>
      <td>${escapeHtml(t("cat." + c.key))}</td>
      <td><input type="text" class="cat-dest" placeholder="_sorted/${c.key}" value="${escapeAttr(c.dest || "")}" spellcheck="false"></td>
      <td>
        <select class="cat-action">
          <option value="skip" ${c.action === "skip" ? "selected" : ""}>${escapeHtml(t("cats.action.skip"))}</option>
          <option value="copy" ${c.action === "copy" ? "selected" : ""}>${escapeHtml(t("cats.action.copy"))}</option>
          <option value="move" ${c.action === "move" ? "selected" : ""}>${escapeHtml(t("cats.action.move"))}</option>
        </select>
      </td>`;
    row.querySelectorAll("input, select").forEach((el) => el.addEventListener("change", scheduleSave));
    row.querySelector(".cat-on").addEventListener("change", () => {
      syncCatRow(row);
      scheduleSave();
    });
    row.querySelector(".cat-dest").addEventListener("input", updateDestPreview);
    body.appendChild(row);
    syncCatRow(row);
  });
  syncAllCatRows();
  updateDestPreview();
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function resolveDest(dest, inputFolder, key) {
  const raw = (dest || "").trim();
  const base = (inputFolder || "").trim() || "…";
  if (!raw) return joinPath(base, "_sorted", key);
  if (/^([a-zA-Z]:[\\/]|\\\\)/.test(raw)) return raw;
  return joinPath(base, raw);
}
function joinPath(...parts) {
  return parts
    .filter(Boolean)
    .join("\\")
    .replace(/\\+/g, "\\")
    .replace(/\\$/, "");
}

function updateDestPreview() {
  const el = $("destPreview");
  if (!el) return;
  const folder = $("inputFolder").value.trim();
  const rows = Array.from(document.querySelectorAll("#cats tr")).slice(0, 3);
  if (!rows.length) {
    el.textContent = "";
    return;
  }
  const lines = rows.map((row) => {
    const key = row.dataset.key;
    const dest = row.querySelector(".cat-dest").value;
    return `${key} → ${resolveDest(dest, folder, key)}`;
  });
  el.textContent = t("cats.preview") + lines.join("  ·  ");
}

function applyConfigToForm(cfg) {
  $("inputFolder").value = cfg.input_folder || "";
  const mode = document.querySelector(`input[name="outputMode"][value="${cfg.output_mode || "csv_only"}"]`);
  if (mode) mode.checked = true;
  const rev = document.querySelector(`input[name="reviewMode"][value="${cfg.review_mode || "auto"}"]`);
  if (rev) rev.checked = true;
  const timing = document.querySelector(`input[name="reviewTiming"][value="${cfg.review_timing || "batch"}"]`);
  if (timing) timing.checked = true;
  syncReviewTiming();
  $("scoreThreshold").value = cfg.score_threshold ?? 2;
  $("serverPort").value = cfg.port ?? 8460;
  $("portHint").textContent = t("behavior.portHint");
  $("ruleBlur").checked = !!(cfg.quality_rules && cfg.quality_rules.blur);
  $("ruleExposure").checked = !!(cfg.quality_rules && cfg.quality_rules.exposure);
  $("ruleJunk").checked = !!(cfg.quality_rules && cfg.quality_rules.junk);
  renderFormats((cfg.formats && cfg.formats.length) ? cfg.formats : DEFAULT_FORMATS);
  $("optRecursive").checked = !!cfg.recursive;
  $("optResume").checked = !!cfg.resume;
  $("optDry").checked = !!cfg.dry_run;
  $("optCategories").checked = !!cfg.categorization;
  $("optReasonName").checked = !!cfg.add_reason_to_name;
  $("optPreserve").checked = !!cfg.preserve_structure;
  renderCategories((cfg.categories && cfg.categories.length) ? cfg.categories : DEFAULT_CATEGORIES);
}

function bindForm() {
  [
    "inputFolder", "scoreThreshold", "serverPort", "ruleBlur", "ruleExposure", "ruleJunk",
    "optRecursive", "optResume", "optDry", "optCategories", "optReasonName", "optPreserve",
  ].forEach((id) => $(id).addEventListener("change", scheduleSave));
  $("optCategories").addEventListener("change", syncAllCatRows);
  document.querySelectorAll('input[name="outputMode"]').forEach((el) => el.addEventListener("change", scheduleSave));
  document.querySelectorAll('input[name="reviewMode"]').forEach((el) => el.addEventListener("change", () => {
    syncReviewTiming();
    scheduleSave();
  }));
  document.querySelectorAll('input[name="reviewTiming"]').forEach((el) => el.addEventListener("change", scheduleSave));
  syncReviewTiming();
}

function fmtNum(n) {
  return new Intl.NumberFormat(LANG === "ru" ? "ru-RU" : "en-US").format(n);
}

/* кастомный confirm */
function uiConfirm(title, message, okLabel) {
  return new Promise((resolve) => {
    const overlay = $("modal");
    $("modalTitle").textContent = title;
    $("modalText").textContent = message;
    $("modalCancel").textContent = t("modal.cancel");
    $("modalOk").textContent = okLabel || t("modal.confirm");
    overlay.hidden = false;
    document.body.style.overflow = "hidden";

    const done = (val) => {
      overlay.hidden = true;
      document.body.style.overflow = "";
      $("modalOk").onclick = null;
      $("modalCancel").onclick = null;
      overlay.onclick = null;
      document.removeEventListener("keydown", onKey);
      resolve(val);
    };
    const onKey = (e) => {
      if (e.key === "Escape") done(false);
      if (e.key === "Enter") done(true);
    };
    $("modalOk").onclick = () => done(true);
    $("modalCancel").onclick = () => done(false);
    overlay.onclick = (e) => { if (e.target === overlay) done(false); };
    document.addEventListener("keydown", onKey);
    $("modalOk").focus();
  });
}

function renderLm(data) {
  lastLm = data;
  const dot = $("lmDot");
  if (data.connected) {
    dot.className = "dot on";
    $("lmTitle").textContent = t("lm.connected");
  } else {
    dot.className = "dot off";
    $("lmTitle").textContent = t("lm.disconnected");
  }
  $("lmUrl").textContent = (data.url || "").replace(/^https?:\/\//, "");
  $("lmModel").textContent = data.active_model || (data.models && data.models[0]?.id) || "—";
  $("lmCtx").textContent = data.context_length ? t("lm.tokens", { n: fmtNum(data.context_length) }) : "—";
  $("lmQuant").textContent = data.quant || "—";
  $("lmParams").textContent = data.params_b ? String(data.params_b) : "—";
  if (data.vram_used_gb != null) {
    $("lmVram").textContent = `${data.vram_used_gb} / ${data.vram_total_gb ?? "?"} GB`;
  } else {
    $("lmVram").textContent = "—";
  }
  $("lmSpeed").textContent = data.sec_per_image
    ? t("lm.secPerImage", { n: data.sec_per_image })
    : (data.speed_tps ? t("lm.tps", { n: data.speed_tps }) : "—");
  $("lmState").textContent = data.load_state || (data.connected ? t("lm.ready") : t("lm.noLink"));
}

function renderJob(job, logLines) {
  lastJob = job;
  lastLog = logLines;
  $("stDone").textContent = fmtNum(job.done || 0);
  $("stOk").textContent = fmtNum(job.ok || 0);
  $("stBad").textContent = fmtNum(job.bad || 0);
  $("stEta").textContent = job.eta || "—";
  const pct = job.percent || 0;
  $("stripFill").style.width = pct + "%";
  $("stripPct").textContent = pct.toFixed(1) + "%";
  $("stripCaption").textContent = job.running
    ? (job.current_file || t("strip.working"))
    : (job.message || t("strip.ready"));
  $("btnStart").disabled = !!job.running;
  $("btnStop").disabled = !job.running;

  const strip = $("strip");
  strip.querySelectorAll(".bad-tick").forEach((n) => n.remove());
  if (job.total > 0) {
    const ticks = Math.min(job.bad || 0, 36);
    for (let i = 0; i < ticks; i++) {
      const tick = document.createElement("div");
      tick.className = "bad-tick";
      tick.style.left = (2 + Math.random() * Math.max(pct, 2)) + "%";
      strip.appendChild(tick);
    }
  }

  const logEl = $("log");
  if (logLines && logLines.length) {
    logEl.innerHTML = logLines.map((line) => {
      let cls = "";
      if (/^\d{2}:\d{2}:\d{2}\s+bad/.test(line)) cls = "bad";
      else if (/^\d{2}:\d{2}:\d{2}\s+ok\s/.test(line)) cls = "ok";
      else if (/ERR|Error|Critical/.test(line)) cls = "err";
      return `<div class="${cls}">${escapeHtml(line)}</div>`;
    }).join("");
    logEl.scrollTop = logEl.scrollHeight;
  }
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    const [lm, st] = await Promise.all([
      api.get("/api/lmstudio").catch(() => ({ connected: false })),
      api.get("/api/status"),
    ]);
    renderLm(lm);
    renderJob(st.job || {}, st.log || []);
    serverOffline(false);
    api.get("/api/review").then((r) => setReviewCountBadge(r.count || 0)).catch(() => {});
    if (st.review_pending && $("reviewModal").hidden && window.__openReviewPending) {
      window.__openReviewPending(st.review_pending);
    }
  } catch (e) {
    serverOffline(true);
  } finally {
    polling = false;
  }
}

async function init() {
  await loadLang(LANG);
  setTheme(localStorage.getItem("yarophoto-theme") || "lab");

  renderFormats(DEFAULT_FORMATS);
  renderCategories(DEFAULT_CATEGORIES);
  $("stripCaption").textContent = t("strip.ready");

  try {
    const data = await api.get("/api/config");
    config = data.config;
    applyConfigToForm(config);
    serverOffline(false);
  } catch (e) {
    serverOffline(true);
  }
  bindForm();
  poll();
  setInterval(poll, 2500);

  $("btnBrowse").addEventListener("click", async () => {
    if (location.protocol === "file:") {
      dz.textContent = t("dropzone.needServer");
      serverOffline(true);
      return;
    }
    try {
      const res = await api.post("/api/browse-folder");
      if (res.path) {
        $("inputFolder").value = res.path;
        scheduleSave();
        updateDestPreview();
      }
    } catch (e) {
      alert(t("alert.browseFail") + e.message);
    }
  });

  $("inputFolder").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      saveConfigNow();
    }
  });
  $("inputFolder").addEventListener("input", updateDestPreview);

  const dz = $("dropzone");
  ["dragenter", "dragover"].forEach((ev) => {
    dz.addEventListener(ev, (e) => {
      e.preventDefault();
      dz.classList.add("drag");
    });
  });
  ["dragleave", "drop"].forEach((ev) => {
    dz.addEventListener(ev, (e) => {
      e.preventDefault();
      dz.classList.remove("drag");
    });
  });
  dz.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    const path = file && (file.path || file.webkitFullPath);
    if (path) {
      $("inputFolder").value = path;
      scheduleSave();
      updateDestPreview();
    } else if (file) {
      $("inputFolder").value = file.name;
      dz.textContent = t("dropzone.pathFail", { name: file.name });
    }
  });

  $("btnScan").addEventListener("click", async () => {
    await saveConfigNow();
    try {
      const res = await api.get("/api/scan");
      $("stripCaption").textContent = res.ok
        ? t("strip.countPrefix") + fmtNum(res.count)
        : (res.error || "—");
    } catch (e) {
      alert(e.message);
    }
  });

  $("btnStart").addEventListener("click", async () => {
    await saveConfigNow();
    const ok = await uiConfirm(t("btn.start"), t("confirm.start"), t("btn.start"));
    if (!ok) return;
    try {
      await api.post("/api/start");
      poll();
    } catch (e) {
      alert(t("alert.startFail") + e.message);
    }
  });

  $("btnStop").addEventListener("click", async () => {
    try {
      await api.post("/api/stop");
      poll();
    } catch (e) {
      alert(e.message);
    }
  });

  $("btnOpenPanel").addEventListener("click", () => {
    const port = parseInt($("serverPort")?.value || "8460", 10) || 8460;
    window.open(`http://127.0.0.1:${port}`, "_blank");
  });

  $("btnStopServer").addEventListener("click", async () => {
    const ok = await uiConfirm(t("btn.stopServer"), t("confirm.stopServer"), t("btn.stopServer"));
    if (!ok) return;
    try {
      await api.post("/api/shutdown");
    } catch (e) {
      /* сервер мог успеть закрыть соединение — это норма */
    }
    setTimeout(() => { serverOffline(true); }, 600);
  });

  const help = $("helpModal");
  $("btnHelp").addEventListener("click", () => {
    renderHelp();
    help.hidden = false;
    document.body.style.overflow = "hidden";
  });
  const closeHelp = () => {
    help.hidden = true;
    document.body.style.overflow = "";
  };
  $("helpClose").addEventListener("click", closeHelp);
  help.addEventListener("click", (e) => {
    if (e.target === help) closeHelp();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !help.hidden) closeHelp();
  });

  bindReview();
}

/* ── review queue ── */
let reviewItems = [];
let reviewIdx = 0;

function setReviewCountBadge(n) {
  const btn = $("btnReview");
  if (!btn) return;
  if (n > 0) {
    btn.hidden = false;
    btn.textContent = `${t("btn.review")} (${n})`;
  } else {
    btn.hidden = true;
  }
}

function showReviewItem() {
  const empty = $("reviewEmpty");
  const body = $("reviewBody");
  const actions = $("reviewActions");
  if (!reviewItems.length) {
    empty.hidden = false;
    empty.textContent = t("review.empty");
    body.hidden = true;
    actions.hidden = true;
    $("reviewCount").textContent = "0 / 0";
    return;
  }
  empty.hidden = true;
  body.hidden = false;
  actions.hidden = false;
  const item = reviewItems[reviewIdx] || reviewItems[0];
  $("reviewCount").textContent = `${reviewIdx + 1} / ${reviewItems.length}`;
  $("reviewFile").textContent = item.filename || item.path || "—";
  $("reviewScore").textContent = item.score != null ? String(item.score) : "—";
  $("reviewQuality").textContent = item.quality || "—";
  $("reviewReason").textContent = item.quality_reason || "—";
  $("reviewTags").textContent = (item.category_tags || []).join(", ") || "—";
  $("reviewImg").src = `/api/review/image?path=${encodeURIComponent(item.path)}`;
  $("reviewImg").onerror = () => {
    $("reviewImg").removeAttribute("src");
    $("reviewFile").textContent = (item.filename || "") + " · " + t("review.noPreview");
  };
}

async function decideReview(decision) {
  const item = reviewItems[reviewIdx];
  if (!item) return;
  try {
    await api.post("/api/review/decide", { path: item.path, decision });
  } catch (e) {
    alert(e.message);
    return;
  }
  if (decision !== "skip") {
    reviewItems.splice(reviewIdx, 1);
    setReviewCountBadge(reviewItems.length);
    if (reviewIdx >= reviewItems.length) reviewIdx = Math.max(0, reviewItems.length - 1);
  } else if (reviewItems.length === 1) {
    // live-режим: «пропустить» отпускает очередь, модалку закрываем
    $("reviewModal").hidden = true;
    document.body.style.overflow = "";
    return;
  } else {
    reviewIdx = (reviewIdx + 1) % reviewItems.length;
  }
  showReviewItem();
}

function bindReview() {
  const modal = $("reviewModal");
  const open = async () => {
    try {
      const res = await api.get("/api/review");
      reviewItems = res.items || [];
      reviewIdx = 0;
      setReviewCountBadge(reviewItems.length);
      showReviewItem();
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    } catch (e) {
      alert(e.message);
    }
  };
  const openPending = (item) => {
    reviewItems = [item];
    reviewIdx = 0;
    showReviewItem();
    modal.hidden = false;
    document.body.style.overflow = "hidden";
  };
  const close = () => {
    modal.hidden = true;
    document.body.style.overflow = "";
  };
  $("btnReview").addEventListener("click", open);
  $("reviewClose").addEventListener("click", close);
  modal.addEventListener("click", (e) => { if (e.target === modal) close(); });
  $("reviewKeep").addEventListener("click", () => decideReview("keep"));
  $("reviewReject").addEventListener("click", () => decideReview("reject"));
  $("reviewSkip").addEventListener("click", () => decideReview("skip"));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !modal.hidden) close();
  });
  window.__openReviewPending = openPending;
}

init();
</script>
